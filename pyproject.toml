[project]
name = "bourdain"
version = "0.1.0"
description = "A local-first meal planning toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.0.0",
    "click>=8.5.0",
    "highspy>=1.15.1",
    "pillow-heif>=1.8.1",
    "pint>=0.26.2",
    "pulp>=4.1.0",
    "pydantic>=2,<3",
    "pymupdf>=2.0",
    "rapidfuzz>=3.14.6",
    "recipe-scrapers>=15.13.0",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
]

[project.scripts]
bourdain = "bourdain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bourdain"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/bourdain",
    "/tests",
    "/docs",
    "/examples",
    "/examples",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.github/workflows",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --strict-markers -m "not live"'
markers = [
    "live: opt-in tests that call external APIs and may require API keys",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "hypothesis>=6.170.5",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
